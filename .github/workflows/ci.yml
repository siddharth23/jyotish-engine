name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licence-headers:
    name: Licence and attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: LICENSE is present and is AGPL-3.0
        run: |
          test -f LICENSE || { echo "LICENSE missing"; exit 1; }
          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" LICENSE \
            || { echo "LICENSE is not AGPL-3.0"; exit 1; }
      - name: NOTICE lists required attributions
        run: |
          for term in "Swiss Ephemeris" "GeoNames" "tzdata"; do
            grep -qi "$term" NOTICE || { echo "NOTICE missing: $term"; exit 1; }
          done

  engine-version-parity:
    name: Engine version parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dart and WASM declare the same engine version
        run: |
          # The two builds must produce identical output for the same inputs, and
          # consuming applications cache on this value. Silent drift would let an
          # astrologer's browser-computed chart disagree with the customer's
          # phone-computed one -- the exact failure the golden-master vectors exist
          # to catch, but invisible until someone compares two reports.
          dart_version=$(sed -n "s/^const String engineVersion = '\(.*\)';$/\1/p" \
            packages/dart/lib/src/version.dart)
          wasm_version=$(sed -n "s/^export const ENGINE_VERSION = '\(.*\)';$/\1/p" \
            packages/wasm/src/version.ts)
          echo "dart: ${dart_version:-<unparsed>}"
          echo "wasm: ${wasm_version:-<unparsed>}"
          if [ -z "$dart_version" ] || [ -z "$wasm_version" ]; then
            echo "Could not parse a version; the declaration format changed." >&2
            exit 1
          fi
          if [ "$dart_version" != "$wasm_version" ]; then
            echo "Engine versions diverge. Bump both together." >&2
            exit 1
          fi

  no-server-side-affordances:
    name: No server-side affordances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject server framework dependencies
        run: |
          # This package must never become trivially runnable on a server.
          # See docs/AGPL-BOUNDARY.md.
          if grep -rniE "\b(express|fastify|koa|hapi|flask|django|gin-gonic)\b" \
               --include="package.json" --include="pubspec.yaml" . ; then
            echo "::error::Server framework dependency found. See docs/AGPL-BOUNDARY.md"
            exit 1
          fi
          echo "No server framework dependencies."

  dart:
    name: Dart package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        working-directory: packages/dart
        run: dart pub get
      - name: Verify formatting
        working-directory: packages/dart
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyse
        working-directory: packages/dart
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/dart
        run: dart test
      - name: Parity fixtures are current
        working-directory: packages/dart
        run: |
          # packages/wasm is checked against this output. Regenerating it must be a
          # no-op, or the reference changed without the port being checked against it.
          dart run tool/derive.dart > ../../test/parity/dart_output.json
          git diff --exit-code -- ../../test/parity/dart_output.json

  wasm:
    name: WASM wrapper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: packages/wasm
        run: npm ci || npm install
      - name: Lint
        working-directory: packages/wasm
        run: npm run lint --if-present
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.10
      - name: Fetch Swiss Ephemeris
        run: ./native/fetch_swisseph.sh
      - name: Build WebAssembly module
        run: ./native/build_wasm.sh
      - name: Test derivation and Dart parity
        working-directory: packages/wasm
        run: npm test
      - name: Test the WebAssembly engine in headless Chrome
        working-directory: packages/wasm
        run: npm run test:browser

  vectors:
    name: Reference vectors are well-formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate vector file
        run: python3 test/validate_vectors.py

  # The derivation half is checked for Dart/TypeScript equality by the parity fixtures
  # above. There is no FFI build yet, so the ephemeris half is only checked in the
  # browser; a Dart FFI comparison belongs here once one exists.
