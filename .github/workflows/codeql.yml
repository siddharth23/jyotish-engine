name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          # `languages`, not `language`. The singular is not an input the action
          # recognises, so it was ignored and init fell back to auto-detecting
          # every language present -- including C/C++, which has no source here
          # because Swiss Ephemeris is fetched rather than vendored. The cpp
          # extractor then failed the whole run with "could not process any code".
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
